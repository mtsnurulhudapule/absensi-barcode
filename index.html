<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scan Absensi Siswa - MTs Nurul Huda</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subjudul {
      margin-top: 0;
      color: #555;
    }

    #reader {
      width: 500px;
      max-width: 95%;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    #hasil {
      width: 500px;
      max-width: 90%;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      box-sizing: border-box;
    }

    .nama {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .kelas {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .hadir {
      font-size: 30px;
      font-weight: bold;
    }

    .nisn {
      margin-top: 10px;
      color: #555;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>SCAN ABSENSI SISWA</h1>
  <p class="subjudul">MTs NURUL HUDA</p>

  <div id="reader"></div>

  <div id="hasil">
    Arahkan barcode kartu siswa ke kamera
  </div>

<script>

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbz934tE785yfmIqT2hPgvbLuGWjVv4y0abY_ltHaFnZUyebWmIMwljQHaxUB0alYs44/exec";

let sedangMemproses = false;

function playSuccessBeep() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(
        0.01,
        audioCtx.currentTime + 0.2
    );

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.2);
}

function berhasilScan(decodedText) {


  if (sedangMemproses) {
    return;
  }

  sedangMemproses = true;

  document.getElementById("hasil").innerHTML =
    "<b>Membaca barcode...</b>";

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      nisn: decodedText
    })
  })
  .then(response => response.json())
  .then(result => {

    if (result.success) {

      playSuccessBeep();

      document.getElementById("hasil").innerHTML =
        '<div class="nama">' + result.nama + '</div>' +
        '<div class="kelas">Kelas ' + result.kelas + '</div>' +
        '<div class="hadir">✓ HADIR</div>' +
        '<div class="nisn">NISN: ' + result.nisn + '</div>';

    } else {

      document.getElementById("hasil").innerHTML =
        '<div class="error">' +
        result.message +
        '</div>';
    }

    setTimeout(function() {

      sedangMemproses = false;

      document.getElementById("hasil").innerHTML =
        "Silakan scan siswa berikutnya";

    }, 2000);

  })
  .catch(error => {

    console.error(error);

    document.getElementById("hasil").innerHTML =
      '<div class="error">Gagal menghubungi Google Sheet</div>';

    setTimeout(function() {
      sedangMemproses = false;
    }, 2000);

  });
}


const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,

    qrbox: {
      width: 350,
      height: 150
    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128
    ]
  },
  false
);


scanner.render(
  berhasilScan,
  function(errorMessage) {
    // Kesalahan pembacaan diabaikan
  }
);

</script>

</body>
</html>
