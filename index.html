<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Barcode - MTs Nurul Huda</title>

  <!-- Library scanner barcode/QR -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #111827;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }

    .subjudul {
      text-align: center;
      margin: 6px 0 20px;
      color: #4b5563;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: center;
      font-size: 16px;
    }

    .catatan {
      margin-top: 15px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.99);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>ABSENSI BARCODE</h1>
    <div class="subjudul">MTs Nurul Huda</div>

    <div id="reader"></div>

    <div id="status" class="status">
      Memulai kamera...
    </div>

    <div class="catatan">
      Arahkan kamera ke barcode/QR siswa.<br>
      Setelah terbaca, data akan dikirim ke Google Sheets.
    </div>

    <button id="mulaiLagi" style="display:none;" onclick="mulaiScanner()">
      SCAN LAGI
    </button>
  </div>

<script>
  // URL Web App Google Apps Script panjenengan
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxD_NDrVRUmScYyn46yKJixl_2RD0wB_uexKCpqqlr_shKlmWUqueZipYd8DmV4xbKUdA/exec";

  let scanner = null;
  let sedangProses = false;

  function setStatus(teks) {
    document.getElementById("status").textContent = teks;
  }

  function bunyiBerhasil() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 1000;
      gain.gain.value = 0.08;

      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  }

  async function onScanSuccess(decodedText) {
    if (sedangProses) return;

    sedangProses = true;
    setStatus("Kode terbaca: " + decodedText + " — memproses...");

    bunyiBerhasil();

    try {
      if (scanner) {
        await scanner.stop();
      }
    } catch (e) {}

    // Kirim kode ke Apps Script dengan navigasi biasa.
    // Cara ini menghindari masalah CORS/fetch.
    const backUrl = encodeURIComponent(window.location.href);
    const tujuan =
      APPS_SCRIPT_URL +
      "?kode=" + encodeURIComponent(decodedText) +
      "&back=" + backUrl;

    window.location.href = tujuan;
  }

  async function mulaiScanner() {
    document.getElementById("mulaiLagi").style.display = "none";
    document.getElementById("reader").innerHTML = "";
    sedangProses = false;
    setStatus("Meminta izin kamera...");

    scanner = new Html5Qrcode("reader");

    try {
      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: function(viewfinderWidth, viewfinderHeight) {
            const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.70);
            return { width: size, height: size };
          },
          aspectRatio: 1.0
        },
        onScanSuccess,
        function(errorMessage) {
          // Error pembacaan per frame sengaja diabaikan.
        }
      );

      setStatus("Kamera aktif — silakan scan barcode siswa.");
    } catch (error) {
      console.error(error);
      setStatus(
        "Kamera belum bisa digunakan. Tekan izin kamera pada browser, lalu muat ulang halaman."
      );
      document.getElementById("mulaiLagi").style.display = "block";
    }
  }

  window.addEventListener("load", mulaiScanner);
</script>
</body>
</html>
